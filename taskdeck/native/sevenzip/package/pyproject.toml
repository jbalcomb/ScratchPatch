[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskdeck-sevenzip"
version = "26.5.0"
description = "7-Zip's archive library and TaskDeck's C shim, built for Android arm64."
license = { text = "LGPL-2.1-or-later (7-Zip; unRAR restriction applies), MIT (shim)" }
requires-python = ">=3.10"

[tool.setuptools]
packages = ["taskdeck_sevenzip"]

[tool.setuptools.package-data]
taskdeck_sevenzip = ["*.so", "LICENSE*"]
