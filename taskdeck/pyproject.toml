[project]
name = "taskdeck"
version = "0.1.0"
description = "A plugin-driven interface for running jobs, built with Flet for Android."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "rsa>=4.9",      # pure-Python RSA for Google service-account auth on Android
    "certifi",       # CA bundle: Python on Android has no system certificates
    "flet-secure-storage==1.0.4",  # credentials vault: Android keystore, unlocked by fingerprint
    "flet-local-auth==1.0.4",      # fingerprint prompt when unlocking again after a lock
    "flet-permission-handler==1.0.4",  # "All files access", to open archives and extract anywhere
    # 7-Zip's archive library + TaskDeck's C shim for Android arm64 (built by the "TaskDeck 7-Zip engine" workflow)
    "taskdeck-sevenzip @ https://github.com/jbalcomb/ScratchPatch/releases/download/taskdeck-sevenzip/taskdeck_sevenzip-26.5.1-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "flet[all]==1.0.4",
    "fastapi<0.120",  # flet-web 1.0.4 passes openapi_prefix, removed in newer FastAPI
    "pytest>=8",
]

# Third-party job packages register here, e.g.
# [project.entry-points."taskdeck.jobs"]
# my_job = "my_package.my_job:PLUGIN"

[tool.flet]
org = "dev.taskdeck"
product = "TaskDeck"
company = "TaskDeck"
copyright = "Copyright (C) 2026"

[tool.flet.app]
path = "src"

# Android-only: TaskDeck's own extension in native/background (foreground service while tasks run).
[tool.flet.android]
dependencies = ["taskdeck-background"]

[tool.flet.android.dev_packages]
taskdeck-background = "../native/background"  # relative to [tool.flet.app] path

[tool.flet.android.permission]
"android.permission.INTERNET" = true  # AI model on the home network, Google Sheets
"android.permission.USE_BIOMETRIC" = true  # fingerprint unlocks the credentials vault
"android.permission.MANAGE_EXTERNAL_STORAGE" = true  # Extract Archive: read and write files anywhere

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
