[project]
name = "idabridge"
version = "0.1.0"
description = "REST API and MCP server around IDA Pro 5.5 (idaw.exe), for agents on a Tailscale network"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "psutil>=5.9",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
idabridge = "idabridge.__main__:main"
idactl = "idabridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idabridge*"]

[tool.setuptools.package-data]
idabridge = ["idc/*.idc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
