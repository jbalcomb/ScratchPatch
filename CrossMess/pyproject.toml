[project]
name = "crossmess"
version = "0.1.0"
description = "Cross-device message bus: signed envelopes and fixed screening before any device acts on a message."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.package-data]
crossmess = ["ruleset.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
