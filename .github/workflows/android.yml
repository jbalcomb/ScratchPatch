name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install "flet[all]==1.0.4"
      - name: Build APK
        # --yes lets flet install the matching Flutter and Android SDKs
        run: flet build apk --yes --no-rich-output --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: taskdeck-apk
          path: build/apk/*.apk
          if-no-files-found: error
