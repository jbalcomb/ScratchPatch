name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/android.yml"

permissions:
  contents: write  # publish the APK to the "taskdeck-latest" release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install "flet[all]==1.0.4"
      - name: Build APK
        # --yes lets flet install the matching Flutter and Android SDKs
        run: flet build apk --yes --no-rich-output --build-number ${{ github.run_number }}
      - run: cp "$(ls build/apk/*.apk | head -n1)" TaskDeck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taskdeck-apk
          path: TaskDeck.apk
          if-no-files-found: error
      - name: Publish to the "latest" release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete taskdeck-latest --yes --cleanup-tag || true
          gh release create taskdeck-latest TaskDeck.apk --prerelease --target "$GITHUB_SHA" \
            --title "TaskDeck (latest build #${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Download TaskDeck.apk on your phone and tap it to install."
