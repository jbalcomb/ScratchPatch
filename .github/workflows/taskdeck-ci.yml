name: TaskDeck CI

on:
  push:
    paths:
      - "taskdeck/**"
      - ".github/workflows/taskdeck-ci.yml"
  pull_request:
    paths:
      - "taskdeck/**"
      - ".github/workflows/taskdeck-ci.yml"
  schedule:
    - cron: "17 6 * * 1"  # weekly plugin review, Mondays

defaults:
  run:
    working-directory: taskdeck

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet==1.0.4" "rsa>=4.9" certifi pytest "flet-secure-storage==1.0.4" "flet-local-auth==1.0.4"
      - name: Cache the 7-Zip engine (Linux build, for the archive tests)
        id: engine
        uses: actions/cache@v4
        with:
          path: /tmp/7z-linux
          key: 7z-linux-${{ hashFiles('taskdeck/native/sevenzip/**') }}
      - name: Build the 7-Zip engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$(cat native/sevenzip/7ZIP_VERSION)" https://github.com/ip7z/7zip.git /tmp/7zip
          native/sevenzip/build.sh /tmp/7zip /tmp/7z-linux
      - run: pytest -q
        env:
          TASKDECK_7Z_DIR: /tmp/7z-linux

  plugin-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet==1.0.4" "rsa>=4.9" certifi
      - name: Commonality review
        env:
          PYTHONPATH: src
        run: |
          python -m taskdeck.review --out reports/plugin-review.md
          python -m taskdeck.review --json --out reports/plugin-review.json
          cat reports/plugin-review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-review
          path: taskdeck/reports/
      - name: Gate on duplicate code and hygiene
        env:
          PYTHONPATH: src
        run: python -m taskdeck.review --strict > /dev/null
