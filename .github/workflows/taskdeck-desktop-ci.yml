name: TaskDeck Desktop CI

on:
  workflow_dispatch:
  push:
    paths:
      - "taskdeck-desktop/**"
      - "taskdeck/src/taskdeck/core/**"   # the job contract the job host speaks for
      - "taskdeck/tests/fixtures/archives/**"   # Extract archive's tests use the phone's test archives
      - ".github/workflows/taskdeck-desktop-ci.yml"
  pull_request:
    paths:
      - "taskdeck-desktop/**"
      - "taskdeck/src/taskdeck/core/**"
      - "taskdeck/tests/fixtures/archives/**"

defaults:
  run:
    working-directory: taskdeck-desktop

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property displayName
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Job host tests (Python, against the phone app's jobs in ../taskdeck)
        run: python -m unittest discover -s python/tests -v
      - name: Configure (MSVC)
        # No -G: CMake picks the newest Visual Studio installed (the runner's may be newer than 2022).
        run: cmake -B build -A x64
      - name: Build (7z.dll from 7-Zip's source with its own makefile, then the app)
        run: cmake --build build --config Release
      - name: Core tests (palette ranking, state file, Credential Manager)
        run: build/Release/core_tests.exe
      - name: Archive tests (Extract archive on 7-Zip, the phone's test archives)
        run: build/Release/archive_tests.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TaskDeck-windows-x64
          path: |
            taskdeck-desktop/build/Release/TaskDeck.exe
            taskdeck-desktop/build/Release/7z.dll
          if-no-files-found: error
