name: TaskDeck Desktop CI

on:
  workflow_dispatch:
  push:
    paths:
      - "taskdeck-desktop/**"
      - ".github/workflows/taskdeck-desktop-ci.yml"
  pull_request:
    paths:
      - "taskdeck-desktop/**"

defaults:
  run:
    working-directory: taskdeck-desktop

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: TaskDeck-windows-x64
          path: taskdeck-desktop/build/Release/TaskDeck.exe
          if-no-files-found: error
