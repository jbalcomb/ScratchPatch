name: TaskDeck Desktop CI

on:
  workflow_dispatch:
  push:
    paths:
      - "taskdeck-desktop/**"
      - ".github/workflows/taskdeck-desktop-ci.yml"
  pull_request:
    paths:
      - "taskdeck-desktop/**"

defaults:
  run:
    working-directory: taskdeck-desktop

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property displayName
      - name: Configure (MSVC)
        # No -G: CMake picks the newest Visual Studio installed (the runner's may be newer than 2022).
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: TaskDeck-windows-x64
          path: taskdeck-desktop/build/Release/TaskDeck.exe
          if-no-files-found: error
