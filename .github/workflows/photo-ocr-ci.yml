name: Photo OCR CI

on:
  push:
    paths:
      - "photo-ocr/**"
      - ".github/workflows/photo-ocr-ci.yml"
  pull_request:
    paths:
      - "photo-ocr/**"
      - ".github/workflows/photo-ocr-ci.yml"

defaults:
  run:
    working-directory: photo-ocr

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest Pillow
      - run: pytest -q
